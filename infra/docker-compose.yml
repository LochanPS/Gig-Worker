# GigBridge local stack — the whole demo from one command (NFR-4):
#   docker compose -f infra/docker-compose.yml up --build
#
# Boots postgres, an anvil dev chain, the backend (migrate -> seed -> serve) and
# the frontend. Build context is the repo root because backend and frontend both
# depend on the shared workspace package.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gigbridge
      POSTGRES_PASSWORD: gigbridge
      POSTGRES_DB: gigbridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigbridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  anvil:
    # Foundry's anvil dev chain. P1 owns the image/tag choice.
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        # service_healthy, not service_started: real settlement deploys contracts
        # at boot, so the chain has to be answering RPC, not just launched.
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gigbridge:gigbridge@postgres:5432/gigbridge
      JWT_SECRET: dev-only-change-me
      RPC_URL: http://anvil:8545
      CHAIN_ID: "31337"
      # anvil well-known account 0 — DEMO ONLY, publicly known, never holds real funds
      PLATFORM_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      DEPLOYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      # Empty key => deterministic template explanations, so the stack needs no
      # network at all once the images are built (NFR-4, ROADMAP risk R2).
      ANTHROPIC_API_KEY: ""
      FX_API_URL: https://api.frankfurter.app
      FX_OFFLINE: "true"
      PORT: "4000"
      NODE_ENV: production
      # The stack already boots a chain, so use it: settle for real against anvil.
      # Without this the contracts deployed next door went untouched and every
      # tx hash was random bytes, which is the one thing the UI cannot tell apart
      # by itself. Contracts deploy on boot from the committed bytecode, and the
      # accounts are anvil's own — no testnet, no funded wallet, nothing to top up.
      # If the chain is unreachable the backend still boots and says so (the
      # settlement badge reads "chain unreachable"), so this cannot wedge the demo.
      SETTLEMENT_MODE: "real"
    # Schema, then demo data, then serve. Idempotent: re-running `up` re-applies
    # nothing and re-seeds onto the same fixed demo ids.
    command: >
      sh -c "pnpm --filter ./backend exec prisma migrate deploy &&
             pnpm --filter ./backend db:seed &&
             pnpm --filter ./backend exec tsx src/index.ts"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # The SPA runs in the user's browser, so it reaches the backend on the
        # host's published port, not the compose network name.
        VITE_API_BASE: http://localhost:4000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  pgdata:
