# GigBridge local stack. `docker compose -f infra/docker-compose.yml up`
# Skeleton — backend/frontend build stages are filled in as those tracks land.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gigbridge
      POSTGRES_PASSWORD: gigbridge
      POSTGRES_DB: gigbridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigbridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  anvil:
    # Foundry's anvil dev chain. P1 owns the image/tag choice.
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "8545:8545"

  # backend:  (filled in by P2 once Dockerfile exists — auto-migrate, deploy
  #            contracts on boot, seed, then serve :4000)
  # frontend: (filled in by P3 — Vite build served on :5173)

volumes:
  pgdata:
