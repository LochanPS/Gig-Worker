# GigBridge local stack. From the repo root:
#   docker compose -f infra/docker-compose.yml up --build
# Brings up Postgres + anvil + the backend in REAL settlement mode (contracts
# deployed on boot, DB migrated + seeded, on-chain event listener running).
# The frontend is currently run separately (`pnpm --filter frontend dev`) and is
# added here once the UI rebuild lands.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gigbridge
      POSTGRES_PASSWORD: gigbridge
      POSTGRES_DB: gigbridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigbridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  anvil:
    # Foundry's anvil dev chain (chain-id 31337, account 0 = the demo key below).
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gigbridge:gigbridge@postgres:5432/gigbridge
      JWT_SECRET: dev-only-change-me
      RPC_URL: http://anvil:8545
      CHAIN_ID: "31337"
      SETTLEMENT_MODE: real
      # Anvil account 0 — DEMO ONLY (owner + platform + deployer).
      PLATFORM_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      DEPLOYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      FX_OFFLINE: "true"
    command: >
      sh -c "pnpm --filter @gigbridge/backend db:migrate &&
             SETTLEMENT_MODE=real pnpm --filter @gigbridge/backend seed &&
             pnpm --filter @gigbridge/backend start"
    ports:
      - "4000:4000"

  # frontend: added after the UI rebuild — the current app does not yet
  #           typecheck/build, so wiring a broken image would break `up`.

volumes:
  pgdata:
